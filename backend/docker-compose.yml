version: '3.8'

services:
  web:
    build: .
    container_name: url-shortener-web
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Pass the PORT variable so the Dockerfile CMD knows which port to bind to
      - PORT=8000

  worker:
    build: .
    container_name: url-shortener-worker
    restart: always
    # Override the default command in the Dockerfile to run the sync script instead
    command: python service/sync.py
    env_file:
      - .env